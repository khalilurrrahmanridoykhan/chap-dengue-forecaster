[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chap-dengue-forecaster"
version = "0.1.0"
description = "Climate-informed Dengue forecasting model compatible with the DHIS2 Climate Health Analytics Platform (CHAP)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Khalilur Rahman", email = "khalilurrahmanridoykhan@gmail.com"}
]
keywords = [
    "dhis2",
    "chap",
    "climate-health",
    "dengue",
    "epidemiology",
    "disease-forecasting",
    "machine-learning",
    "python",
    "open-science"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    "mlflow>=2.10.0"
]

[project.urls]
Homepage = "https://github.com/khalilurrrahmanridoykhan/chap-dengue-forecaster"
Repository = "https://github.com/khalilurrrahmanridoykhan/chap-dengue-forecaster"
Documentation = "https://github.com/khalilurrrahmanridoykhan/chap-dengue-forecaster#readme"
